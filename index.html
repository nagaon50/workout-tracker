<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPL 운동 기록</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root{
    --bg: #1E2023;
    --bg-card: #26292D;
    --bg-card-hover: #2D3136;
    --steel: #7A8590;
    --chalk: #EDEAE3;
    --chalk-dim: #A8A49B;
    --plate: #C4402B;
    --plate-dim: #7A2A1E;
    --line: #363A3F;
    --done: #4E8B5C;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--chalk);
    font-family: 'Noto Sans KR', sans-serif;
    min-height:100vh;
    padding-bottom: 40px;
  }
  .header{
    padding: 28px 20px 18px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top:0;
    background: var(--bg);
    z-index: 10;
  }
  .eyebrow{
    font-family:'Oswald',sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--plate);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 600;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin: 0 0 16px 0;
    text-transform: uppercase;
  }
  .day-tabs{
    display:flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .day-tabs::-webkit-scrollbar{ display:none; }
  .day-tab{
    flex: 1 0 auto;
    min-width: 58px;
    padding: 10px 4px;
    text-align:center;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size: 12px;
    letter-spacing: 0.5px;
    color: var(--chalk-dim);
    cursor:pointer;
    transition: all .15s ease;
  }
  .day-tab.active{
    background: var(--plate);
    border-color: var(--plate);
    color: var(--chalk);
  }
  .main{ padding: 18px 16px; }
  .date-row{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-bottom: 16px;
    padding: 0 2px;
  }
  .date-label{
    font-size: 13px;
    color: var(--chalk-dim);
  }
  .streak{
    font-family:'Oswald',sans-serif;
    font-size: 12px;
    color: var(--plate);
    font-weight:600;
    letter-spacing: 0.5px;
  }
  .exercise-card{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow:hidden;
  }
  .ex-header{
    padding: 14px 16px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap: 10px;
  }
  .ex-name-group{
    display:flex;
    align-items:center;
    gap: 10px;
    min-width:0;
  }
  .ex-icon{
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 9px;
    background: var(--bg);
    border: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 6px;
  }
  .ex-icon svg{
    width: 100%;
    height: 100%;
  }
  .ex-name{
    font-family:'Oswald',sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.3px;
    overflow:hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--chalk);
    text-decoration: underline;
    text-decoration-style: dotted;
    text-decoration-color: var(--steel);
    text-underline-offset: 3px;
  }
  .ex-target{
    font-size: 11px;
    color: var(--chalk-dim);
    letter-spacing: 0.5px;
  }
  .set-rows{ padding: 0 12px 12px; }
  .set-row{
    display:grid;
    grid-template-columns: 28px 1fr 1fr 34px;
    gap: 8px;
    align-items:center;
    padding: 6px 4px;
  }
  .set-row.time-mode{
    grid-template-columns: 28px 1fr 34px;
  }
  .set-num{
    font-family:'Oswald',sans-serif;
    font-size: 12px;
    color: var(--steel);
    text-align:center;
    font-weight: 600;
  }
  .set-input{
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--chalk);
    font-size: 14px;
    padding: 8px 6px;
    text-align:center;
    font-family:'Oswald',sans-serif;
    width:100%;
  }
  .set-input::placeholder{ color: #565A5F; }
  .set-input:focus{ outline:none; border-color: var(--plate); }
  .set-check{
    width: 30px;
    height: 30px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--chalk-dim);
    font-size: 15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .set-check.done{
    background: var(--done);
    border-color: var(--done);
    color: var(--chalk);
  }
  .col-labels{
    display:grid;
    grid-template-columns: 28px 1fr 1fr 34px;
    gap: 8px;
    padding: 0 4px 4px;
    font-size: 10px;
    color: var(--steel);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .col-labels.time-mode{
    grid-template-columns: 28px 1fr 34px;
  }
  .col-labels span:nth-child(2), .col-labels span:nth-child(3){ text-align:center; }
  .ex-chevron{
    color: var(--steel);
    font-size: 12px;
    margin-left: 4px;
    transition: transform .15s ease;
  }
  .ex-header{ cursor: pointer; }
  .ex-recent{
    margin: 0 12px 10px;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 12px;
    color: var(--chalk-dim);
  }
  .ex-recent b{ color: var(--chalk); font-weight:600; }
  .add-set{
    margin: 4px 4px 2px;
    padding: 8px;
    text-align:center;
    font-size: 12px;
    color: var(--steel);
    border: 1px dashed var(--line);
    border-radius: 6px;
    cursor:pointer;
  }
  .footer-bar{
    padding: 16px 16px 4px;
    display:flex;
    gap:10px;
  }
  .save-btn{
    flex:1;
    background: var(--plate);
    color: var(--chalk);
    border:none;
    border-radius: 10px;
    padding: 14px;
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size: 14px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor:pointer;
  }
  .history-btn{
    background: var(--bg-card);
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    border-radius: 10px;
    padding: 14px 18px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size: 13px;
    cursor:pointer;
  }
  .toast{
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--done);
    color: var(--chalk);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    transition: transform .25s ease;
    z-index: 100;
  }
  .toast.show{ transform: translateX(-50%) translateY(0); }

  .history-panel{
    display:none;
    padding: 4px 16px 20px;
  }
  .history-panel.show{ display:block; }
  .history-header{
    position: sticky;
    top: 0;
    background: var(--bg);
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 12px 0 14px;
    z-index: 5;
  }
  .back-btn{
    background: var(--bg-card);
    border: 1px solid var(--line);
    color: var(--chalk);
    border-radius: 8px;
    padding: 9px 14px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size: 13px;
    letter-spacing: 0.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap: 6px;
  }
  .history-title{
    font-family:'Oswald',sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--chalk-dim);
    text-transform: uppercase;
  }

  /* 오늘의 추천 루틴 */
  .reco-card{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin: 14px 0 16px;
  }
  .reco-eyebrow{
    font-family:'Oswald',sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--plate);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .reco-recent{
    display:flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .reco-recent-item{
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 10px;
    font-size: 11.5px;
    color: var(--chalk-dim);
  }
  .reco-recent-item b{ color: var(--chalk); font-weight:600; }
  .reco-suggest{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
  }
  .reco-suggest-text{
    font-size: 14px;
    color: var(--chalk);
  }
  .reco-suggest-text b{ color: var(--plate); font-family:'Oswald',sans-serif; letter-spacing:0.3px; }
  .reco-btn{
    background: var(--plate);
    color: var(--chalk);
    border:none;
    border-radius: 7px;
    padding: 9px 14px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size: 12px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    cursor:pointer;
  }
  .reco-empty{
    font-size: 13px;
    color: var(--chalk-dim);
  }

  /* 기록 통계 */
  .history-stats{
    display:flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat-box{
    flex:1;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    text-align:center;
  }
  .stat-num{
    font-family:'Oswald',sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--plate);
  }
  .stat-label{
    font-size: 10.5px;
    color: var(--chalk-dim);
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  /* 뷰 전환 (리스트/달력) */
  .view-toggle{
    display:flex;
    gap: 6px;
    margin-bottom: 14px;
  }
  .view-toggle-btn{
    flex:1;
    text-align:center;
    padding: 9px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size: 12.5px;
    letter-spacing: 0.5px;
    color: var(--chalk-dim);
    cursor:pointer;
  }
  .view-toggle-btn.active{
    background: var(--plate);
    border-color: var(--plate);
    color: var(--chalk);
  }

  /* 달력 */
  .calendar{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 12px;
  }
  .cal-nav-btn{
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    border-radius: 6px;
    width: 30px;
    height: 30px;
    font-size: 15px;
    cursor:pointer;
  }
  .cal-month-label{
    font-family:'Oswald',sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
  }
  .cal-grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    text-align:center;
  }
  .cal-weekday{
    font-size: 10px;
    color: var(--steel);
    padding-bottom: 4px;
  }
  .cal-day{
    position: relative;
    aspect-ratio: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 12px;
    color: var(--chalk-dim);
    border-radius: 6px;
    cursor: default;
  }
  .cal-day.has-record{
    color: var(--chalk);
    background: var(--bg);
    cursor: pointer;
    font-weight: 600;
  }
  .cal-day.has-record::after{
    content:'';
    position:absolute;
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--plate);
  }
  .cal-day.selected{
    background: var(--plate);
    color: var(--chalk);
  }
  .cal-day.selected.has-record::after{ background: var(--chalk); }
  .cal-day.today{
    outline: 1px solid var(--plate);
  }
  .cal-detail{
    margin-top: 6px;
  }

  .history-empty{
    color: var(--chalk-dim);
    font-size: 13px;
    text-align:center;
    padding: 40px 20px;
    border: 1px dashed var(--line);
    border-radius: 10px;
  }
  .history-entry{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .history-entry-head{
    display:flex;
    justify-content:space-between;
    margin-bottom: 8px;
  }
  .history-day{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    color: var(--plate);
    font-size: 13px;
    letter-spacing: 1px;
  }
  .history-date{
    font-size: 12px;
    color: var(--chalk-dim);
  }
  .history-ex{
    font-size: 12.5px;
    color: var(--chalk-dim);
    line-height: 1.6;
  }
  .history-ex b{ color: var(--chalk); font-weight:500; }
  .loading{
    text-align:center;
    padding: 60px 20px;
    color: var(--chalk-dim);
    font-size: 13px;
  }

  .add-ex-card{
    border: 1px dashed var(--line);
    border-radius: 12px;
    margin-bottom: 12px;
    padding: 14px 16px;
  }
  .add-ex-trigger{
    display:flex;
    align-items:center;
    gap: 8px;
    color: var(--chalk-dim);
    font-family:'Oswald',sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor:pointer;
  }
  .add-ex-trigger .plus{
    color: var(--plate);
    font-size: 18px;
    line-height:1;
  }
  .add-ex-form{
    display:none;
    margin-top: 12px;
    gap: 8px;
    flex-direction: column;
  }
  .add-ex-form.show{ display:flex; }
  .add-ex-form input{
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--chalk);
    font-size: 14px;
    padding: 10px 10px;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .add-ex-form input:focus{ outline:none; border-color: var(--plate); }
  .add-ex-form-actions{
    display:flex;
    gap: 8px;
  }
  .add-ex-confirm{
    flex:1;
    background: var(--plate);
    color: var(--chalk);
    border:none;
    border-radius: 6px;
    padding: 10px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size: 13px;
    letter-spacing: 0.5px;
    cursor:pointer;
  }
  .add-ex-cancel{
    background: transparent;
    color: var(--chalk-dim);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    cursor:pointer;
  }
  .ex-remove{
    color: var(--steel);
    font-size: 16px;
    cursor:pointer;
    padding: 0 2px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="eyebrow">Push · Pull · Legs</div>
  <h1>운동 기록</h1>
  <div class="day-tabs">
    <div class="day-tab active" data-day="chest">가슴</div>
    <div class="day-tab" data-day="back">등</div>
    <div class="day-tab" data-day="shoulder">어깨</div>
    <div class="day-tab" data-day="arm">팔</div>
    <div class="day-tab" data-day="leg">하체</div>
    <div class="day-tab" data-day="abs">복근</div>
    <div class="day-tab" data-day="cardio">유산소</div>
  </div>
  <div style="margin-top:10px; font-size:11px; color:var(--steel); text-align:center;">📱 이 브라우저에만 저장돼요 (다른 기기·다른 브라우저에선 안 보여요)</div>
</div>

<div class="main" id="mainView">
  <div class="reco-card" id="recoCard"></div>
  <div class="date-row">
    <span class="date-label" id="dateLabel"></span>
    <span class="streak" id="streakLabel"></span>
  </div>
  <div id="exerciseList" class="loading">불러오는 중...</div>
  <div class="footer-bar">
    <button class="save-btn" id="saveBtn">오늘 기록 저장</button>
    <button class="history-btn" id="historyToggle">기록 보기</button>
  </div>
</div>

<div class="history-panel" id="historyPanel">
  <div class="history-header">
    <button class="back-btn" id="historyBackBtn">← 홈으로</button>
    <span class="history-title">운동 기록</span>
  </div>
  <div class="history-stats" id="historyStats"></div>
  <div class="view-toggle">
    <div class="view-toggle-btn active" id="viewListBtn">리스트</div>
    <div class="view-toggle-btn" id="viewCalBtn">달력</div>
  </div>
  <div id="historyContent"></div>
  <div id="calendarView" style="display:none;">
    <div class="calendar" id="calendarBox"></div>
    <div class="cal-detail" id="calDetail"></div>
  </div>
</div>

<div class="toast" id="toast">저장됐어요 💪</div>

<script>
// 사파리/로컬 브라우저 저장용 — 이 브라우저(이 폰)에만 기록이 남습니다.
const storage = {
  async get(key){
    const v = localStorage.getItem(key);
    if(v === null) return null;
    return { key, value: v };
  },
  async set(key, value){
    localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key){
    localStorage.removeItem(key);
    return { key, deleted: true };
  }
};

// 장비 아이콘 — 크고 단순하게, 한눈에 식별 가능하도록
const B = '#A8A49B'; // 보조 색
const P = '#C4402B'; // 포인트 색 (원판/바)

const ICONS = {
  barbell: `<svg viewBox="0 0 40 40"><line x1="4" y1="20" x2="36" y2="20" stroke="${B}" stroke-width="3" stroke-linecap="round"/><rect x="1" y="8" width="6" height="24" rx="2" fill="${P}"/><rect x="9" y="12" width="4" height="16" rx="1.5" fill="${P}"/><rect x="27" y="12" width="4" height="16" rx="1.5" fill="${P}"/><rect x="33" y="8" width="6" height="24" rx="2" fill="${P}"/></svg>`,
  dumbbell: `<svg viewBox="0 0 40 40"><line x1="14" y1="20" x2="26" y2="20" stroke="${B}" stroke-width="5" stroke-linecap="round"/><rect x="3" y="10" width="11" height="20" rx="4" fill="${P}"/><rect x="26" y="10" width="11" height="20" rx="4" fill="${P}"/></svg>`,

let currentDay = 'chest';
let currentData = {}; // { exerciseName: [{weight, reps, done}, ...] }
let currentRoutine = []; // [{name, target}, ...] for the active day
let historyLoaded = false;
let expandedState = {}; // { exName: true/false } — 접기/펼치기 상태
let recentRecordCache = {}; // { exName: [{date, summary}, ...] | null | 'loading' }

// 'minsec' = 분+초 입력 (복근), 'min' = 분만 입력 (유산소), false = 무게+횟수(기본)
function timeMode(day){
  if(day === 'abs') return 'minsec';
  if(day === 'cardio') return 'min';
  return false;
}

function todayKey(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function formatDateLabel(){
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

function emptySet(){
  const tm = timeMode(currentDay);
  if(tm === 'minsec') return { minutes:'', minutesAuto:true, seconds:'', secondsAuto:true, done:false };
  if(tm === 'min') return { minutes:'', minutesAuto:true, done:false };
  return { weight:'', weightAuto:true, reps:'', repsAuto:true, done:false };
}

function initEmptyData(exercises){
  const data = {};
  exercises.forEach(ex => {
    data[ex.name] = [emptySet(), emptySet(), emptySet()];
  });
  return data;
}

function routineKey(day){ return `workout:routine:${day}`; }

async function loadRoutine(day){
  try{
    const res = await storage.get(routineKey(day));
    if(res && res.value){
      return JSON.parse(res.value);
    }
  }catch(e){}
  // fall back to default built-in list
  return ROUTINE[day].exercises.map(ex => ({...ex}));
}

async function saveRoutine(day, routine){
  try{
    await storage.set(routineKey(day), JSON.stringify(routine));
  }catch(e){ console.error('루틴 저장 실패', e); }
}

async function loadTodayEntry(){
  const key = `workout:${todayKey()}:${currentDay}`;
  document.getElementById('exerciseList').innerHTML = '<div class="loading">불러오는 중...</div>';
  expandedState = {};
  recentRecordCache = {};

  currentRoutine = await loadRoutine(currentDay);

  try{
    const result = await storage.get(key);
    if(result && result.value){
      currentData = JSON.parse(result.value);
      // 새로 추가된 운동인데 오늘 기록에 아직 없으면 빈 세트 채워넣기
      currentRoutine.forEach(ex => {
        if(!currentData[ex.name]){
          currentData[ex.name] = [emptySet()];
        }
      });
    } else {
      currentData = initEmptyData(currentRoutine);
    }
  }catch(e){
    currentData = initEmptyData(currentRoutine);
  }
  renderExercises();
}

async function addExercise(name, target){
  if(!name.trim()) return;
  currentRoutine.push({name: name.trim(), target: target.trim() || '직접 추가'});
  await saveRoutine(currentDay, currentRoutine);
  currentData[name.trim()] = [emptySet(), emptySet(), emptySet()];
  renderExercises();
}

async function removeExercise(name){
  currentRoutine = currentRoutine.filter(ex => ex.name !== name);
  await saveRoutine(currentDay, currentRoutine);
  delete currentData[name];
  renderExercises();
}

function formatSetSummary(day, sets){
  const tm = timeMode(day);
  if(tm === 'minsec'){
    return sets.map(s => `${s.minutes || 0}분 ${s.seconds || 0}초`).join(', ');
  }
  if(tm === 'min'){
    return sets.map(s => `${s.minutes || '-'}분`).join(', ');
  }
  return sets.map(s => `${s.weight || '-'}kg×${s.reps || '-'}`).join(', ');
}

function filterNonEmptySets(day, sets){
  const tm = timeMode(day);
  if(tm === 'minsec') return sets.filter(s => s.minutes || s.seconds);
  if(tm === 'min') return sets.filter(s => s.minutes);
  return sets.filter(s => s.weight || s.reps);
}

async function getRecentRecordsForExercise(day, exName, limit = 3){
  try{
    const dates = (await getAllDateEntries())
      .filter(e => e.endsWith('|' + day))
      .map(e => e.split('|')[0])
      .sort()
      .reverse();
    const todayStr = todayKey();
    const records = [];
    for(const date of dates){
      if(date === todayStr) continue; // 오늘 기록은 제외하고 "지난" 기록만
      const res = await storage.get(`workout:${date}:${day}`);
      if(!res || !res.value) continue;
      const data = JSON.parse(res.value);
      const sets = filterNonEmptySets(day, data[exName] || []);
      if(sets.length === 0) continue;
      records.push({ date, summary: formatSetSummary(day, sets) });
      if(records.length >= limit) break;
    }
    return records;
  }catch(e){
    return null;
  }
}

function renderExercises(){
  const list = document.getElementById('exerciseList');
  list.className = '';
  list.innerHTML = '';
  const tMode = timeMode(currentDay);
  currentRoutine.forEach(ex => {
    const sets = currentData[ex.name] || [emptySet()];
    const isExpanded = !!expandedState[ex.name];
    const card = document.createElement('div');
    card.className = 'exercise-card';

    let setsHtml;
    if(tMode === 'minsec'){
      setsHtml = `<div class="col-labels"><span></span><span>분</span><span>초</span><span></span></div>`;
    } else if(tMode === 'min'){
      setsHtml = `<div class="col-labels time-mode"><span></span><span>시간(분)</span><span></span></div>`;
    } else {
      setsHtml = `<div class="col-labels"><span></span><span>무게(kg)</span><span>횟수</span><span></span></div>`;
    }

    sets.forEach((s, i) => {
      if(tMode === 'minsec'){
        setsHtml += `
          <div class="set-row" data-ex="${ex.name}" data-idx="${i}">
            <div class="set-num">${i+1}</div>
            <input class="set-input minutes-input" type="number" inputmode="numeric" placeholder="0" value="${s.minutes || ''}">
            <input class="set-input seconds-input" type="number" inputmode="numeric" placeholder="0" value="${s.seconds || ''}">
            <div class="set-check ${s.done ? 'done' : ''}">${s.done ? '✓' : ''}</div>
          </div>
        `;
      } else if(tMode === 'min'){
        setsHtml += `
          <div class="set-row time-mode" data-ex="${ex.name}" data-idx="${i}">
            <div class="set-num">${i+1}</div>
            <input class="set-input minutes-input" type="number" inputmode="decimal" placeholder="0" value="${s.minutes || ''}">
            <div class="set-check ${s.done ? 'done' : ''}">${s.done ? '✓' : ''}</div>
          </div>
        `;
      } else {
        setsHtml += `
          <div class="set-row" data-ex="${ex.name}" data-idx="${i}">
            <div class="set-num">${i+1}</div>
            <input class="set-input weight-input" type="number" inputmode="decimal" placeholder="0" value="${s.weight || ''}">
            <input class="set-input reps-input" type="number" inputmode="numeric" placeholder="0" value="${s.reps || ''}">
            <div class="set-check ${s.done ? 'done' : ''}">${s.done ? '✓' : ''}</div>
          </div>
        `;
      }
    });
    setsHtml += `<div class="add-set" data-ex="${ex.name}">+ 세트 추가</div>`;

    let recentHtml = '';
    if(isExpanded){
      const cached = recentRecordCache[ex.name];
      if(cached === 'loading' || cached === undefined){
        recentHtml = `<div class="ex-recent">최근 기록 불러오는 중...</div>`;
      } else if(!cached || cached.length === 0){
        recentHtml = `<div class="ex-recent">최근 기록 없음</div>`;
      } else {
        recentHtml = `<div class="ex-recent">${cached.map(r => `<div>${r.date.slice(5)} · <b>${r.summary}</b></div>`).join('')}</div>`;
      }
    }

    card.innerHTML = `
      <div class="ex-header" data-ex="${ex.name}">
        <span class="ex-name-group">
          <span class="ex-icon">${ICONS[ex.icon] || ICONS.custom}</span>
          <a class="ex-name" href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name + ' 운동 방법')}" target="_blank" rel="noopener">${ex.name}</a>
        </span>
        <span style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
          ${isExpanded ? `<span class="ex-target">${ex.target}</span>` : ''}
          <span class="ex-remove" data-ex="${ex.name}" title="운동 삭제">✕</span>
          <span class="ex-chevron">${isExpanded ? '▾' : '▸'}</span>
        </span>
      </div>
      <div class="ex-body" style="display:${isExpanded ? 'block' : 'none'};">
        ${recentHtml}
        <div class="set-rows">${setsHtml}</div>
      </div>
    `;
    list.appendChild(card);
  });

  // add-exercise card
  const addCard = document.createElement('div');
  addCard.className = 'add-ex-card';
  addCard.innerHTML = `
    <div class="add-ex-trigger" id="addExTrigger"><span class="plus">+</span> 운동 추가</div>
    <div class="add-ex-form" id="addExForm">
      <input type="text" id="newExName" placeholder="운동 이름 (예: 데드리프트)">
      <input type="text" id="newExTarget" placeholder="${timeMode(currentDay) ? '목표 (예: 3세트 x 1분) — 선택' : '목표 (예: 3세트 x 10회) — 선택'}">
      <div class="add-ex-form-actions">
        <button class="add-ex-confirm" id="addExConfirm">추가하기</button>
        <button class="add-ex-cancel" id="addExCancel">취소</button>
      </div>
    </div>
  `;
  list.appendChild(addCard);

  document.getElementById('addExTrigger').addEventListener('click', () => {
    document.getElementById('addExForm').classList.add('show');
    document.getElementById('addExTrigger').style.display = 'none';
    document.getElementById('newExName').focus();
  });
  document.getElementById('addExCancel').addEventListener('click', () => {
    document.getElementById('addExForm').classList.remove('show');
    document.getElementById('addExTrigger').style.display = 'flex';
  });
  document.getElementById('addExConfirm').addEventListener('click', async () => {
    const name = document.getElementById('newExName').value;
    const target = document.getElementById('newExTarget').value;
    if(!name.trim()) return;
    await addExercise(name, target);
  });

  list.querySelectorAll('.ex-remove').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const name = e.target.dataset.ex;
      await removeExercise(name);
    });
  });

  // 헤더 클릭 = 접기/펼치기 토글 (이름 링크·삭제 버튼 클릭은 제외)
  list.querySelectorAll('.ex-header').forEach(header => {
    header.addEventListener('click', async (e) => {
      if(e.target.closest('.ex-name') || e.target.closest('.ex-remove')) return;
      const name = header.dataset.ex;
      const willExpand = !expandedState[name];
      expandedState[name] = willExpand;
      if(willExpand && recentRecordCache[name] === undefined){
        recentRecordCache[name] = 'loading';
        renderExercises();
        const rec = await getRecentRecordsForExercise(currentDay, name, 3);
        recentRecordCache[name] = rec;
        renderExercises();
      } else {
        renderExercises();
      }
    });
  });

  // 무게/횟수/시간 자동 입력: 값을 입력하면 아래 세트들에 동일 값이 계속 반영됨.
  // 단, 특정 세트를 직접 수정하면 그 세트는 자동입력 대상에서 제외되어 이후에도 유지됨.
  function wireAutoFillInput(selector, field, autoField){
    list.querySelectorAll(selector).forEach(inp => {
      inp.addEventListener('input', e => {
        const row = e.target.closest('.set-row');
        const exName = row.dataset.ex, idx = +row.dataset.idx;
        const value = e.target.value;
        currentData[exName][idx][field] = value;
        currentData[exName][idx][autoField] = false; // 직접 입력한 세트는 자동입력 대상에서 제외

        const card = row.closest('.exercise-card');
        card.querySelectorAll('.set-row').forEach(r => {
          const rIdx = +r.dataset.idx;
          const targetSet = currentData[exName][rIdx];
          if(rIdx > idx && targetSet && targetSet[autoField] !== false){
            targetSet[field] = value;
            targetSet[autoField] = true;
            const inputEl = r.querySelector(`.${selector.replace('.', '')}`);
            if(inputEl) inputEl.value = value;
          }
        });
      });
    });
  }

  wireAutoFillInput('.weight-input', 'weight', 'weightAuto');
  wireAutoFillInput('.reps-input', 'reps', 'repsAuto');
  wireAutoFillInput('.minutes-input', 'minutes', 'minutesAuto');
  wireAutoFillInput('.seconds-input', 'seconds', 'secondsAuto');

  list.querySelectorAll('.set-check').forEach(chk => {
    chk.addEventListener('click', e => {
      const row = e.target.closest('.set-row');
      const exName = row.dataset.ex, idx = +row.dataset.idx;
      currentData[exName][idx].done = !currentData[exName][idx].done;
      renderExercises();
    });
  });
  list.querySelectorAll('.add-set').forEach(btn => {
    btn.addEventListener('click', e => {
      const exName = e.target.dataset.ex;
      currentData[exName].push(emptySet());
      renderExercises();
    });
  });
}

async function saveToday(){
  const key = `workout:${todayKey()}:${currentDay}`;
  try{
    const result = await storage.set(key, JSON.stringify(currentData));
    if(result){
      showToast();
      // update streak/index of dates for this day type
      await updateDateIndex();
      historyLoaded = false; // force refresh next time history opened
      loadRecommendation();
    }
  }catch(e){
    console.error('저장 실패', e);
  }
}

async function updateDateIndex(){
  try{
    const idxKey = 'workout:dates';
    let dates = [];
    try{
      const res = await storage.get(idxKey);
      if(res && res.value) dates = JSON.parse(res.value);
    }catch(e){}
    const entry = `${todayKey()}|${currentDay}`;
    if(!dates.includes(entry)){
      dates.push(entry);
      await storage.set(idxKey, JSON.stringify(dates));
    }
  }catch(e){ console.error(e); }
}

function showToast(){
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(()=> toast.classList.remove('show'), 1800);
}

function buildEntryCardHtml(date, day, data){
  const dayLabel = ROUTINE[day] ? ROUTINE[day].label.split(' · ')[0] : day.toUpperCase();
  let exHtml = '';
  Object.keys(data).forEach(exName => {
    const sets = filterNonEmptySets(day, data[exName] || []);
    if(sets.length === 0) return;
    const setStr = formatSetSummary(day, sets);
    exHtml += `<div class="history-ex"><b>${exName}</b> — ${setStr}</div>`;
  });
  if(!exHtml) return '';
  return `
    <div class="history-entry">
      <div class="history-entry-head">
        <span class="history-day">${dayLabel}</span>
        <span style="display:flex; align-items:center; gap:10px;">
          <span class="history-date">${date}</span>
          <span class="history-delete" data-date="${date}" data-day="${day}" title="이 기록 삭제">삭제</span>
        </span>
      </div>
      ${exHtml}
    </div>
  `;
}

function wireDeleteButtons(container, onDeleted){
  container.querySelectorAll('.history-delete').forEach(btn => {
    btn.addEventListener('click', async () => {
      const { date, day } = btn.dataset;
      if(!confirm(`${date} ${ROUTINE[day] ? ROUTINE[day].label : day} 기록을 삭제할까요?`)) return;
      await deleteHistoryEntry(date, day);
      onDeleted();
    });
  });
}

async function getAllDateEntries(){
  const idxRes = await storage.get('workout:dates');
  let dates = [];
  if(idxRes && idxRes.value) dates = JSON.parse(idxRes.value);
  return dates;
}

function countRecentWorkoutDays(dates, days){
  const cutoff = new Date();
  cutoff.setHours(0,0,0,0);
  cutoff.setDate(cutoff.getDate() - (days - 1));
  const uniqueDates = new Set();
  dates.forEach(entry => {
    const [date] = entry.split('|');
    const d = new Date(date + 'T00:00:00');
    if(d >= cutoff) uniqueDates.add(date);
  });
  return uniqueDates.size;
}

async function loadHistoryStats(){
  const box = document.getElementById('historyStats');
  try{
    const dates = await getAllDateEntries();
    const c7 = countRecentWorkoutDays(dates, 7);
    const c30 = countRecentWorkoutDays(dates, 30);
    box.innerHTML = `
      <div class="stat-box"><div class="stat-num">${c7}</div><div class="stat-label">최근 7일 운동일</div></div>
      <div class="stat-box"><div class="stat-num">${c30}</div><div class="stat-label">최근 30일 운동일</div></div>
    `;
  }catch(e){
    box.innerHTML = '';
  }
}

async function loadHistory(){
  const panel = document.getElementById('historyContent');
  panel.innerHTML = '<div class="loading">불러오는 중...</div>';
  loadHistoryStats();
  try{
    const dates = (await getAllDateEntries()).slice().sort().reverse();

    if(dates.length === 0){
      panel.innerHTML = '<div class="history-empty">아직 저장된 기록이 없어요.<br>오늘 운동을 기록해보세요!</div>';
      return;
    }

    let html = '';
    for(const entry of dates.slice(0, 30)){
      const [date, day] = entry.split('|');
      const res = await storage.get(`workout:${date}:${day}`);
      if(!res || !res.value) continue;
      const data = JSON.parse(res.value);
      html += buildEntryCardHtml(date, day, data);
    }
    panel.innerHTML = html || '<div class="history-empty">아직 저장된 기록이 없어요.</div>';
    wireDeleteButtons(panel, loadHistory);
  }catch(e){
    panel.innerHTML = '<div class="history-empty">기록을 불러오지 못했어요.</div>';
  }
}

async function deleteHistoryEntry(date, day){
  try{
    await storage.delete(`workout:${date}:${day}`);
  }catch(e){ console.error('기록 삭제 실패', e); }
  try{
    const idxRes = await storage.get('workout:dates');
    let dates = [];
    if(idxRes && idxRes.value) dates = JSON.parse(idxRes.value);
    dates = dates.filter(entry => entry !== `${date}|${day}`);
    await storage.set('workout:dates', JSON.stringify(dates));
  }catch(e){ console.error('인덱스 업데이트 실패', e); }

  // 오늘 기록이 삭제된 경우, 현재 보고 있는 오늘 데이터도 갱신
  if(date === todayKey() && day === currentDay){
    currentData = initEmptyData(currentRoutine);
  }
}

// ===== 달력 뷰 =====
let calMonth = new Date();
calMonth.setDate(1);
let calSelectedDate = null;

function ymd(d){ return d.toISOString().slice(0,10); }

async function renderCalendar(){
  const box = document.getElementById('calendarBox');
  const dates = await getAllDateEntries();
  const dateSet = {}; // date -> [day,...]
  dates.forEach(entry => {
    const [date, day] = entry.split('|');
    if(!dateSet[date]) dateSet[date] = [];
    dateSet[date].push(day);
  });

  const year = calMonth.getFullYear();
  const month = calMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = todayKey();

  let cells = '';
  ['일','월','화','수','목','금','토'].forEach(w => { cells += `<div class="cal-weekday">${w}</div>`; });
  for(let i = 0; i < startOffset; i++){ cells += `<div class="cal-day"></div>`; }
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasRecord = !!dateSet[dateStr];
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === calSelectedDate;
    cells += `<div class="cal-day ${hasRecord ? 'has-record' : ''} ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" data-date="${dateStr}">${d}</div>`;
  }

  box.innerHTML = `
    <div class="cal-nav">
      <div class="cal-nav-btn" id="calPrev">‹</div>
      <div class="cal-month-label">${year}년 ${month+1}월</div>
      <div class="cal-nav-btn" id="calNext">›</div>
    </div>
    <div class="cal-grid">${cells}</div>
  `;

  document.getElementById('calPrev').addEventListener('click', () => {
    calMonth.setMonth(calMonth.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', () => {
    calMonth.setMonth(calMonth.getMonth() + 1);
    renderCalendar();
  });

  box.querySelectorAll('.cal-day.has-record').forEach(cell => {
    cell.addEventListener('click', async () => {
      calSelectedDate = cell.dataset.date;
      renderCalendar();
      await showCalDetail(calSelectedDate, dateSet[calSelectedDate]);
    });
  });
}

async function showCalDetail(dateStr, dayTypes){
  const detail = document.getElementById('calDetail');
  detail.innerHTML = '<div class="loading">불러오는 중...</div>';
  let html = '';
  for(const day of dayTypes){
    const res = await storage.get(`workout:${dateStr}:${day}`);
    if(res && res.value){
      html += buildEntryCardHtml(dateStr, day, JSON.parse(res.value));
    }
  }
  detail.innerHTML = html || '<div class="history-empty">기록을 불러오지 못했어요.</div>';
  wireDeleteButtons(detail, async () => {
    renderCalendar();
    showCalDetail(dateStr, dayTypes);
  });
}

// ===== 오늘의 추천 루틴 =====
const DAY_ORDER = ['chest','back','shoulder','arm','leg','abs','cardio'];

async function loadRecommendation(){
  const box = document.getElementById('recoCard');
  try{
    const dates = (await getAllDateEntries()).slice().sort().reverse();
    if(dates.length === 0){
      box.innerHTML = `
        <div class="reco-eyebrow">오늘의 추천 루틴</div>
        <div class="reco-empty">아직 기록이 없어요. 오늘 첫 운동을 시작해보세요!</div>
      `;
      return;
    }

    // 최근 2회 세션 (날짜+부위 기준 중복 없이)
    const recentEntries = dates.slice(0, 2).map(e => {
      const [date, day] = e.split('|');
      return { date, day };
    });

    const recentHtml = recentEntries.map(r => {
      const label = ROUTINE[r.day] ? ROUTINE[r.day].label : r.day;
      return `<div class="reco-recent-item"><b>${label}</b> · ${r.date.slice(5)}</div>`;
    }).join('');

    // 최근 3회 안에 하지 않은 부위 중 로테이션 순서상 가장 먼저인 것을 추천
    const recentDays = dates.slice(0, 3).map(e => e.split('|')[1]);
    let suggested = DAY_ORDER.find(d => !recentDays.includes(d));
    if(!suggested){
      const lastDay = dates[0].split('|')[1];
      const lastIdx = DAY_ORDER.indexOf(lastDay);
      suggested = DAY_ORDER[(lastIdx + 1) % DAY_ORDER.length];
    }
    const suggestedLabel = ROUTINE[suggested] ? ROUTINE[suggested].label : suggested;

    box.innerHTML = `
      <div class="reco-eyebrow">오늘의 추천 루틴</div>
      <div class="reco-recent">${recentHtml}</div>
      <div class="reco-suggest">
        <div class="reco-suggest-text">오늘은 <b>${suggestedLabel}</b> 어때요?</div>
        <button class="reco-btn" id="recoGoBtn" data-day="${suggested}">시작하기</button>
      </div>
    `;
    document.getElementById('recoGoBtn').addEventListener('click', () => {
      selectDay(suggested);
      window.scrollTo({top: 0, behavior:'smooth'});
    });
  }catch(e){
    box.innerHTML = '';
  }
}
