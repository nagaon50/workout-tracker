<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPL 운동 기록</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root{
    --bg: #1E2023;
    --bg-card: #26292D;
    --bg-card-hover: #2D3136;
    --steel: #7A8590;
    --chalk: #EDEAE3;
    --chalk-dim: #A8A49B;
    --plate: #C4402B;
    --plate-dim: #7A2A1E;
    --line: #363A3F;
    --done: #4E8B5C;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--chalk);
    font-family: 'Noto Sans KR', sans-serif;
    min-height:100vh;
  }
  .page{ display:none; padding-bottom: 92px; }
  .page.active{ display:block; }

  .header{
    padding: 28px 20px 18px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top:0;
    background: var(--bg);
    z-index: 10;
  }
  .eyebrow{
    font-family:'Oswald',sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--plate);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 600;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin: 0 0 4px 0;
    text-transform: uppercase;
  }
  .subtitle{
    font-size: 12.5px;
    color: var(--chalk-dim);
    margin-bottom: 4px;
  }
  .workout-top-row{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .workout-top-row .eyebrow{ margin:0; }
  .day-tabs{
    display:flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .day-tabs::-webkit-scrollbar{ display:none; }
  .day-tab{
    flex: 1 0 auto;
    min-width: 58px;
    padding: 10px 4px;
    text-align:center;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size: 12px;
    letter-spacing: 0.5px;
    color: var(--chalk-dim);
    cursor:pointer;
    transition: all .15s ease;
  }
  .day-tab.active{
    background: var(--plate);
    border-color: var(--plate);
    color: var(--chalk);
  }
  .main{ padding: 18px 16px; }
  #homeWorkoutView .main{ padding-bottom: 110px; }
  .date-row{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-bottom: 16px;
    padding: 0 2px;
  }
  .date-label{
    font-size: 13px;
    color: var(--chalk-dim);
  }
  .streak{
    font-family:'Oswald',sans-serif;
    font-size: 12px;
    color: var(--plate);
    font-weight:600;
    letter-spacing: 0.5px;
  }
  .exercise-card{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow:hidden;
  }
  .ex-header{
    padding: 14px 16px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap: 10px;
    cursor: pointer;
  }
  .ex-name-group{
    display:flex;
    align-items:center;
    gap: 10px;
    min-width:0;
  }
  .ex-icon{
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 9px;
    background: var(--bg);
    border: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 6px;
  }
  .ex-icon svg{ width: 100%; height: 100%; }
  .ex-name-col{
    display:flex;
    flex-direction:column;
    min-width:0;
    overflow:hidden;
  }
  .ex-name{
    font-family:'Oswald',sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.3px;
    overflow:hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--chalk);
    text-decoration: underline;
    text-decoration-style: dotted;
    text-decoration-color: var(--steel);
    text-underline-offset: 3px;
  }
  .ex-name-en{
    font-size: 10.5px;
    color: var(--steel);
    letter-spacing: 0.2px;
    overflow:hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 1px;
  }
  .ex-freq-badge{
    flex-shrink: 0;
    white-space: nowrap;
    font-size: 10px;
    font-weight: 600;
    color: var(--plate);
    background: rgba(196, 64, 43, 0.12);
    border: 1px solid var(--plate-dim);
    border-radius: 20px;
    padding: 3px 8px;
    letter-spacing: 0.2px;
  }
  .ex-target{
    font-size: 11px;
    color: var(--chalk-dim);
    letter-spacing: 0.5px;
  }
  .set-rows{ padding: 0 12px 12px; }
  .set-row{
    display:grid;
    grid-template-columns: 28px 1fr 1fr 34px;
    gap: 8px;
    align-items:center;
    padding: 6px 4px;
  }
  .set-row.time-mode{ grid-template-columns: 28px 1fr 34px; }
  .set-num{
    font-family:'Oswald',sans-serif;
    font-size: 12px;
    color: var(--steel);
    text-align:center;
    font-weight: 600;
  }
  .set-input{
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--chalk);
    font-size: 14px;
    padding: 8px 6px;
    text-align:center;
    font-family:'Oswald',sans-serif;
    width:100%;
  }
  .set-input::placeholder{ color: #565A5F; }
  .set-input:focus{ outline:none; border-color: var(--plate); }
  .set-check{
    width: 30px;
    height: 30px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--chalk-dim);
    font-size: 15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .set-check.done{
    background: var(--done);
    border-color: var(--done);
    color: var(--chalk);
  }
  .col-labels{
    display:grid;
    grid-template-columns: 28px 1fr 1fr 34px;
    gap: 8px;
    padding: 0 4px 4px;
    font-size: 10px;
    color: var(--steel);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .col-labels.time-mode{ grid-template-columns: 28px 1fr 34px; }
  .col-labels span:nth-child(2), .col-labels span:nth-child(3){ text-align:center; }
  .ex-chevron{
    color: var(--steel);
    font-size: 12px;
    margin-left: 4px;
    transition: transform .15s ease;
  }
  .ex-recent{
    margin: 0 12px 10px;
    padding: 8px 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 12px;
    color: var(--chalk-dim);
  }
  .ex-recent b{ color: var(--chalk); font-weight:600; }
  .add-set{
    margin: 4px 4px 2px;
    padding: 8px;
    text-align:center;
    font-size: 12px;
    color: var(--steel);
    border: 1px dashed var(--line);
    border-radius: 6px;
    cursor:pointer;
  }
  .footer-bar{
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(60px + env(safe-area-inset-bottom, 0px));
    padding: 8px 16px;
    display:flex;
    justify-content: center;
    background: var(--bg);
    border-top: 1px solid var(--line);
    z-index: 90;
  }
  .save-btn-compact{
    background: var(--plate);
    color: var(--chalk);
    border:none;
    border-radius: 20px;
    padding: 9px 26px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size: 12.5px;
    letter-spacing: 1px;
    cursor:pointer;
  }

  /* 휴식 타이머 */
  .rest-timer-bar{
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(118px + env(safe-area-inset-bottom, 0px));
    background: var(--bg-card);
    border: 1px solid var(--plate);
    border-radius: 14px;
    padding: 10px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
    z-index: 95;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  }
  .rest-timer-label{ font-size: 11px; color: var(--chalk-dim); letter-spacing: 0.3px; }
  .rest-timer-time{
    font-family:'Oswald',sans-serif;
    font-size: 21px;
    font-weight: 700;
    color: var(--plate);
    letter-spacing: 0.5px;
  }
  .rest-timer-controls{ display:flex; gap: 6px; align-items:center; }
  .rest-timer-btn{
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    border-radius: 7px;
    padding: 7px 10px;
    font-size: 11px;
    font-family:'Oswald',sans-serif;
    font-weight: 600;
    cursor:pointer;
  }
  .rest-timer-skip{
    background: var(--plate);
    border: none;
    color: var(--chalk);
    border-radius: 7px;
    padding: 7px 12px;
    font-size: 11px;
    font-family:'Oswald',sans-serif;
    font-weight: 600;
    cursor:pointer;
  }

  .save-btn{
    flex:1;
    background: var(--plate);
    color: var(--chalk);
    border:none;
    border-radius: 10px;
    padding: 14px;
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size: 14px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor:pointer;
  }
  .history-btn{
    background: var(--bg-card);
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    border-radius: 10px;
    padding: 14px 18px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size: 13px;
    cursor:pointer;
  }
  .toast{
    position: fixed;
    bottom: 92px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    opacity: 0;
    pointer-events: none;
    background: var(--done);
    color: var(--chalk);
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 200;
    white-space: nowrap;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }

  .back-btn{
    background: var(--bg-card);
    border: 1px solid var(--line);
    color: var(--chalk);
    border-radius: 8px;
    padding: 9px 14px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size: 13px;
    letter-spacing: 0.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap: 6px;
    white-space: nowrap;
  }

  /* 홈 */
  .home-actions{
    display:flex;
    flex-direction:column;
    gap: 10px;
    margin-top: 10px;
  }
  .home-actions .save-btn, .home-actions .history-btn{ width:100%; }

  /* 홈 대시보드 */
  .dash-section{ margin-bottom: 4px; }
  .dash-section-title{
    font-family:'Oswald',sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: var(--plate);
    margin-bottom: 10px;
  }
  .dash-divider{
    border-top: 1px dashed var(--line);
    margin: 18px 0;
  }
  .dash-empty{
    font-size: 12.5px;
    color: var(--chalk-dim);
    padding: 4px 2px;
  }

  /* 주간 진행률 바 */
  .week-progress-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .week-progress-row:last-child{ margin-bottom: 0; }
  .week-progress-label{ font-size: 13px; color: var(--chalk); font-weight: 500; min-width: 48px; }
  .week-progress-bar{
    font-family: monospace;
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--plate);
    flex: 1;
    text-align: center;
  }
  .week-progress-count{
    font-family:'Oswald',sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--chalk-dim);
    min-width: 46px;
    text-align: right;
  }

  /* 몸의 변화 미니 요약 */
  .body-mini-row{ display:flex; gap: 8px; }
  .body-mini-box{
    flex:1;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 8px;
    text-align:center;
  }
  .body-mini-label{ font-size: 10.5px; color: var(--chalk-dim); margin-bottom: 6px; letter-spacing: 0.3px; }
  .body-mini-value{ font-family:'Oswald',sans-serif; font-size: 16px; font-weight: 700; color: var(--chalk); }
  .body-mini-delta{ font-size: 11px; margin-top: 3px; font-family:'Oswald',sans-serif; font-weight: 600; }
  .body-mini-delta.up{ color: var(--plate); }
  .body-mini-delta.down{ color: var(--done); }

  /* 최근 운동 카드 */
  .recent-workout-card{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .recent-workout-title{ font-family:'Oswald',sans-serif; font-size: 15px; font-weight: 700; color: var(--chalk); margin-bottom: 8px; }
  .recent-workout-meta{ display:flex; gap: 16px; font-size: 12.5px; color: var(--chalk-dim); }
  .recent-workout-meta b{ color: var(--chalk); font-family:'Oswald',sans-serif; }

  /* 이번 달 성장 */
  .growth-row{ display:flex; gap: 8px; }
  .growth-box{
    flex:1;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 8px;
    text-align:center;
  }
  .growth-num{ font-family:'Oswald',sans-serif; font-size: 18px; font-weight: 700; color: var(--plate); }
  .growth-label{ font-size: 10.5px; color: var(--chalk-dim); margin-top: 3px; letter-spacing: 0.3px; }

  /* 최고기록 리스트 */
  .pr-item{
    display:flex;
    justify-content: space-between;
    align-items:center;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .pr-item:last-child{ margin-bottom: 0; }
  .pr-name{ font-size: 13.5px; color: var(--chalk); font-weight: 500; }
  .pr-value{ font-family:'Oswald',sans-serif; font-size: 14px; font-weight: 700; color: var(--plate); }

  /* 오늘의 추천 루틴 */
  .reco-card{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin: 14px 0 16px;
  }
  .reco-eyebrow{
    font-family:'Oswald',sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--plate);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .reco-recent{
    display:flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .reco-recent-item{
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 10px;
    font-size: 11.5px;
    color: var(--chalk-dim);
  }
  .reco-recent-item b{ color: var(--chalk); font-weight:600; }
  .reco-suggest{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
  }
  .reco-suggest-text{ font-size: 14px; color: var(--chalk); }
  .reco-suggest-text b{ color: var(--plate); font-family:'Oswald',sans-serif; letter-spacing:0.3px; }
  .reco-btn{
    background: var(--plate);
    color: var(--chalk);
    border:none;
    border-radius: 7px;
    padding: 9px 14px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size: 12px;
    letter-spacing: 0.5px;
    white-space: nowrap;
    cursor:pointer;
  }
  .reco-empty{ font-size: 13px; color: var(--chalk-dim); }

  /* 기록 통계 */
  .history-stats{
    display:flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat-box{
    flex:1;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    text-align:center;
  }
  .stat-num{
    font-family:'Oswald',sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--plate);
  }
  .stat-label{
    font-size: 10.5px;
    color: var(--chalk-dim);
    letter-spacing: 0.5px;
    margin-top: 2px;
  }
  .stat-delta{ font-size: 10.5px; margin-top: 2px; font-family:'Oswald',sans-serif; }
  .stat-delta.up{ color: var(--plate); }
  .stat-delta.down{ color: var(--done); }

  /* 뷰 전환 (리스트/달력, 변화 그래프 지표) */
  .view-toggle{ display:flex; gap: 6px; margin-bottom: 14px; }
  .view-toggle-btn{
    flex:1;
    text-align:center;
    padding: 9px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size: 12.5px;
    letter-spacing: 0.5px;
    color: var(--chalk-dim);
    cursor:pointer;
  }
  .view-toggle-btn.active{
    background: var(--plate);
    border-color: var(--plate);
    color: var(--chalk);
  }

  /* 달력 */
  .calendar{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 12px; }
  .cal-nav-btn{
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--chalk-dim);
    border-radius: 6px;
    width: 30px;
    height: 30px;
    font-size: 15px;
    cursor:pointer;
  }
  .cal-month-label{ font-family:'Oswald',sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.5px; }
  .cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align:center; }
  .cal-weekday{ font-size: 10px; color: var(--steel); padding-bottom: 4px; }
  .cal-day{
    position: relative;
    aspect-ratio: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 12px;
    color: var(--chalk-dim);
    border-radius: 6px;
    cursor: default;
  }
  .cal-day.has-record{ color: var(--chalk); background: var(--bg); cursor: pointer; font-weight: 600; }
  .cal-day.has-record::after{
    content:'';
    position:absolute;
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--plate);
  }
  .cal-day.selected{ background: var(--plate); color: var(--chalk); }
  .cal-day.selected.has-record::after{ background: var(--chalk); }
  .cal-day.today{ outline: 1px solid var(--plate); }
  .cal-detail{ margin-top: 6px; }

  .history-empty{
    color: var(--chalk-dim);
    font-size: 13px;
    text-align:center;
    padding: 40px 20px;
    border: 1px dashed var(--line);
    border-radius: 10px;
  }
  .history-entry{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .history-entry-head{ display:flex; justify-content:space-between; margin-bottom: 8px; }
  .history-date-title{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    color: var(--chalk);
    font-size: 14px;
    letter-spacing: 0.5px;
  }
  .history-section{
    padding: 8px 0;
    border-top: 1px dashed var(--line);
  }
  .history-section:first-of-type{ border-top: none; padding-top: 0; }
  .history-section-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px; }
  .history-day{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    color: var(--plate);
    font-size: 13px;
    letter-spacing: 1px;
  }
  .history-date{ font-size: 12px; color: var(--chalk-dim); }
  .history-delete{ font-size: 12px; color: var(--steel); cursor:pointer; text-decoration: underline; text-decoration-style: dotted; white-space: nowrap; }
  .history-delete.confirming{ color: var(--plate); font-weight: 600; text-decoration: none; }
  .history-ex{ font-size: 12.5px; color: var(--chalk-dim); line-height: 1.6; }
  .history-ex b{ color: var(--chalk); font-weight:500; }

let currentDay = 'chest';
let currentData = {}; // { exerciseName: [{weight, reps, done}, ...] }
let currentRoutine = []; // [{name, target}, ...] for the active day
let historyLoaded = false;
let expandedState = {}; // { exName: true/false } — 접기/펼치기 상태
let recentRecordCache = {}; // { exName: [{date, summary}, ...] | null | 'loading' }
let frequentExerciseSet = new Set(); // 이 부위에서 자주 기록한 운동 이름들

// 운동별 기록 방식: 'weight_reps'(무게+횟수, 기본), 'reps'(횟수만, 맨몸 반복),
// 'sec'(초만, 버티기 동작), 'min'(분만, 유산소)
function getExerciseMode(day, ex){
  if(day === 'cardio') return 'min';
  if(day === 'abs') return (ex && ex.unit === 'sec') ? 'sec' : 'reps';
  return 'weight_reps';
}

function todayKey(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function formatDateLabel(){
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

function emptySet(mode){
  if(mode === 'sec') return { seconds:'', secondsAuto:true, done:false };
  if(mode === 'min') return { minutes:'', minutesAuto:true, done:false };
  if(mode === 'reps') return { reps:'', repsAuto:true, done:false };
  return { weight:'', weightAuto:true, reps:'', repsAuto:true, done:false };
}

function initEmptyData(exercises, day){
  const data = {};
  exercises.forEach(ex => {
    const mode = getExerciseMode(day, ex);
    data[ex.name] = [emptySet(mode), emptySet(mode), emptySet(mode)];
  });
  return data;
}

function routineKey(day){ return `workout:routine:${day}`; }

async function loadRoutine(day){
  try{
    const res = await storage.get(routineKey(day));
    if(res && res.value){
      return JSON.parse(res.value);
    }
  }catch(e){}
  return ROUTINE[day].exercises.map(ex => ({...ex}));
}

async function saveRoutine(day, routine){
  try{
    await storage.set(routineKey(day), JSON.stringify(routine));
  }catch(e){ console.error('루틴 저장 실패', e); }
}

async function computeFrequentExercises(day){
  try{
    const entries = (await getAllDateEntries()).filter(e => e.endsWith('|' + day));
    const counts = {};
    for(const entry of entries){
      const [date] = entry.split('|');
      const res = await storage.get(`workout:${date}:${day}`);
      if(!res || !res.value) continue;
      const data = JSON.parse(res.value);
      Object.keys(data).forEach(exName => {
        if((data[exName] || []).length > 0){
          counts[exName] = (counts[exName] || 0) + 1;
        }
      });
    }
    const frequent = Object.keys(counts)
      .filter(name => counts[name] >= 2) // 최소 2번 이상 기록된 운동만
      .sort((a, b) => counts[b] - counts[a])
      .slice(0, 3); // 상위 3개
    return new Set(frequent);
  }catch(e){
    return new Set();
  }
}

async function loadTodayEntry(){
  const key = `workout:${todayKey()}:${currentDay}`;
  document.getElementById('exerciseList').innerHTML = '<div class="loading">불러오는 중...</div>';
  expandedState = {};
  recentRecordCache = {};

  currentRoutine = await loadRoutine(currentDay);
  frequentExerciseSet = await computeFrequentExercises(currentDay);

  try{
    const result = await storage.get(key);
    if(result && result.value){
      currentData = JSON.parse(result.value);
      currentRoutine.forEach(ex => {
        if(!currentData[ex.name]){
          currentData[ex.name] = [emptySet(getExerciseMode(currentDay, ex))];
        }
      });
    } else {
      currentData = initEmptyData(currentRoutine, currentDay);
    }
  }catch(e){
    currentData = initEmptyData(currentRoutine, currentDay);
  }
  renderExercises();
}

async function addExercise(name, target){
  if(!name.trim()) return;
  const newEx = {name: name.trim(), target: target.trim() || '직접 추가'};
  currentRoutine.push(newEx);
  await saveRoutine(currentDay, currentRoutine);
  const mode = getExerciseMode(currentDay, newEx);
  currentData[name.trim()] = [emptySet(mode), emptySet(mode), emptySet(mode)];
  renderExercises();
}

async function removeExercise(name){
  currentRoutine = currentRoutine.filter(ex => ex.name !== name);
  await saveRoutine(currentDay, currentRoutine);
  delete currentData[name];
  renderExercises();
}

// 세트의 실제 값 구조를 보고 기록 방식을 역으로 판별 (기록 저장 당시의 방식 그대로 표시하기 위함)
function inferSetMode(s){
  if(!s) return 'weight_reps';
  if('weight' in s) return 'weight_reps';
  if('seconds' in s && 'minutes' in s) return 'minsec_legacy';
  if('seconds' in s) return 'sec';
  if('minutes' in s) return 'min';
  if('reps' in s) return 'reps';
  return 'weight_reps';
}

function formatSetSummary(sets){
  return sets.map(s => {
    const mode = inferSetMode(s);
    if(mode === 'weight_reps') return `${s.weight || '-'}kg×${s.reps || '-'}`;
    if(mode === 'reps') return `${s.reps || '-'}회`;
    if(mode === 'sec') return `${s.seconds || 0}초`;
    if(mode === 'minsec_legacy') return `${s.minutes || 0}분 ${s.seconds || 0}초`;
    if(mode === 'min') return `${s.minutes || '-'}분`;
    return '-';
  }).join(', ');
}

function filterNonEmptySets(sets){
  return (sets || []).filter(s => {
    const mode = inferSetMode(s);
    if(mode === 'weight_reps') return !!(s.weight || s.reps);
    if(mode === 'reps') return !!s.reps;
    if(mode === 'sec') return !!s.seconds;
    if(mode === 'minsec_legacy') return !!(s.minutes || s.seconds);
    if(mode === 'min') return !!s.minutes;
    return false;
  });
}

async function getRecentRecordsForExercise(day, exName, limit = 3){
  try{
    const dates = (await getAllDateEntries())
      .filter(e => e.endsWith('|' + day))
      .map(e => e.split('|')[0])
      .sort()
      .reverse();
    const todayStr = todayKey();
    const records = [];
    for(const date of dates){
      if(date === todayStr) continue;
      const res = await storage.get(`workout:${date}:${day}`);
      if(!res || !res.value) continue;
      const data = JSON.parse(res.value);
      const sets = filterNonEmptySets(data[exName] || []);
      if(sets.length === 0) continue;
      records.push({ date, summary: formatSetSummary(sets) });
      if(records.length >= limit) break;
    }
    return records;
  }catch(e){
    return null;
  }
}

// ===== 휴식 타이머 =====
const REST_TIMER_DEFAULT = 90; // 기본 휴식 시간(초)
let restTimerInterval = null;
let restTimerRemaining = 0;

function formatTimerTime(sec){
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function updateRestTimerDisplay(){
  document.getElementById('restTimerTime').textContent = formatTimerTime(Math.max(0, restTimerRemaining));
}

let audioCtx = null;
function getAudioCtx(){
  try{
    if(!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return null;
      audioCtx = new Ctx();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}

function playBeep(ctx, delay){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 880;
  const t0 = ctx.currentTime + delay;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + 0.25);
}

function unlockAudio(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    gain.gain.value = 0.00001; // 사실상 무음이지만 실제 재생을 발생시켜 iOS 등에서 오디오를 확실히 풀어둠
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.02);
  }catch(e){}
}

function playRestEndSound(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    playBeep(ctx, 0);
    playBeep(ctx, 0.3);
    playBeep(ctx, 0.6);
  }catch(e){ console.error('알림음 재생 실패', e); }
}

function startRestTimer(seconds){
  restTimerRemaining = seconds;
  unlockAudio(); // 체크박스 클릭(사용자 제스처) 시점에 오디오를 미리 활성화해둠
  const bar = document.getElementById('restTimerBar');
  bar.style.display = 'flex';
  updateRestTimerDisplay();
  if(restTimerInterval) clearInterval(restTimerInterval);
  restTimerInterval = setInterval(() => {
    restTimerRemaining--;
    if(restTimerRemaining <= 0){
      updateRestTimerDisplay();
      clearInterval(restTimerInterval);
      restTimerInterval = null;
      playRestEndSound();
      if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
      showToast('휴식 끝! 다음 세트 가볼까요 💪');
      setTimeout(hideRestTimer, 900);
      return;
    }
    updateRestTimerDisplay();
  }, 1000);
}

function hideRestTimer(){
  if(restTimerInterval) clearInterval(restTimerInterval);
  restTimerInterval = null;
  const bar = document.getElementById('restTimerBar');
  if(bar) bar.style.display = 'none';
}

document.getElementById('restTimerSkip').addEventListener('click', hideRestTimer);
document.getElementById('restTimerPlus').addEventListener('click', () => {
  if(restTimerInterval === null && restTimerRemaining <= 0) return;
  restTimerRemaining += 15;
  updateRestTimerDisplay();
});
document.getElementById('restTimerMinus').addEventListener('click', () => {
  if(restTimerInterval === null) return;
  restTimerRemaining = Math.max(0, restTimerRemaining - 15);
  updateRestTimerDisplay();
  if(restTimerRemaining === 0){
    clearInterval(restTimerInterval);
    restTimerInterval = null;
    playRestEndSound();
    if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
    showToast('휴식 끝! 다음 세트 가볼까요 💪');
    setTimeout(hideRestTimer, 900);
  }
});

async function saveToday(){
  const key = `workout:${todayKey()}:${currentDay}`;
  // 체크(✓) 표시한 세트만 기록으로 저장
  const filtered = {};
  Object.keys(currentData).forEach(exName => {
    const doneSets = (currentData[exName] || []).filter(s => s.done);
    if(doneSets.length > 0) filtered[exName] = doneSets;
  });
  if(Object.keys(filtered).length === 0){
    showToast('체크한 세트가 없어요 ✓');
    return;
  }
  try{
    const result = await storage.set(key, JSON.stringify(filtered));
    if(result){
      // 오늘 운동 화면에 처음 들어온 시각부터 지금까지 경과 시간을 세션 시간으로 기록
      const startKey = `workout:sessionStart:${todayKey()}`;
      const startedAt = localStorage.getItem(startKey);
      if(startedAt){
        const minutes = Math.max(1, Math.round((Date.now() - Number(startedAt)) / 60000));
        localStorage.setItem(`workout:duration:${todayKey()}`, String(minutes));
      }
      showToast();
      await updateDateIndex();
      historyLoaded = false;
      loadRecommendation();
      loadHomeExtras();
    }
  }catch(e){
    console.error('저장 실패', e);
  }
}

async function updateDateIndex(){
  try{
    const idxKey = 'workout:dates';
    let dates = [];
    try{
      const res = await storage.get(idxKey);
      if(res && res.value) dates = JSON.parse(res.value);
    }catch(e){}
    const entry = `${todayKey()}|${currentDay}`;
    if(!dates.includes(entry)){
      dates.push(entry);
      await storage.set(idxKey, JSON.stringify(dates));
    }
  }catch(e){ console.error(e); }
}

let toastTimer = null;

function buildDateCardHtml(date, dayEntries){
  // dayEntries: [{day, data}, ...] — 같은 날짜에 기록된 부위들을 모두 모아 하나의 카드로 표시
  let sections = '';
  dayEntries.forEach(({day, data}) => {
    const dayLabel = ROUTINE[day] ? ROUTINE[day].label.split(' · ')[0] : day.toUpperCase();
    let exHtml = '';
    Object.keys(data).forEach(exName => {
      const sets = filterNonEmptySets(data[exName] || []);
      if(sets.length === 0) return;
      const setStr = formatSetSummary(sets);
      exHtml += `<div class="history-ex"><b>${exName}</b> — ${setStr}</div>`;
    });
    if(!exHtml) return;
    sections += `
      <div class="history-section">
        <div class="history-section-head">
          <span class="history-day">${dayLabel}</span>
          <span class="history-delete" data-date="${date}" data-day="${day}" title="이 부위 기록 삭제">삭제</span>
        </div>
        ${exHtml}
      </div>
    `;
  });
  if(!sections) return '';
  return `
    <div class="history-entry">
      <div class="history-entry-head">
        <span class="history-date-title">${date}</span>
      </div>
      ${sections}
    </div>
  `;
}

async function buildDateEntriesFor(date, days){
  const dayEntries = [];
  for(const day of days){
    const res = await storage.get(`workout:${date}:${day}`);
    if(res && res.value) dayEntries.push({ day, data: JSON.parse(res.value) });
  }
  return dayEntries;
}

function wireDeleteButtons(container, onDeleted){
  container.querySelectorAll('.history-delete').forEach(btn => {
    btn.addEventListener('click', async (e) => {

      if(btn.dataset.confirming !== '1'){

          btn.dataset.confirming = '0';
          btn.textContent = '삭제';

async function getAllDateEntries(){
  const idxRes = await storage.get('workout:dates');
  let dates = [];
  if(idxRes && idxRes.value) dates = JSON.parse(idxRes.value);
  return dates;
}

function countRecentWorkoutDays(dates, days){
  const cutoff = new Date();
  cutoff.setHours(0,0,0,0);
  cutoff.setDate(cutoff.getDate() - (days - 1));
  const uniqueDates = new Set();
  dates.forEach(entry => {
    const [date] = entry.split('|');
    const d = new Date(date + 'T00:00:00');
    if(d >= cutoff) uniqueDates.add(date);
  });
  return uniqueDates.size;
}

  const box = document.getElementById('historyStats');
  try{
    const dates = await getAllDateEntries();
    const c7 = countRecentWorkoutDays(dates, 7);
    const c30 = countRecentWorkoutDays(dates, 30);
    box.innerHTML = `
      <div class="stat-box"><div class="stat-num">${c7}</div><div class="stat-label">최근 7일 운동일</div></div>
      <div class="stat-box"><div class="stat-num">${c30}</div><div class="stat-label">최근 30일 운동일</div></div>
    `;

async function loadHistory(){
  const panel = document.getElementById('historyContent');
  panel.innerHTML = '<div class="loading">불러오는 중...</div>';
  loadHistoryStats();
  try{
    const entries = await getAllDateEntries();

    if(entries.length === 0){
      panel.innerHTML = '<div class="history-empty">아직 저장된 기록이 없어요.<br>오늘 운동을 기록해보세요!</div>';
      return;
    }

    // 같은 날짜끼리 부위를 모아 그룹화
    const byDate = {};
    entries.forEach(entry => {
      const [date, day] = entry.split('|');
      if(!byDate[date]) byDate[date] = [];
      byDate[date].push(day);
    });
    const sortedDates = Object.keys(byDate).sort().reverse();

    let html = '';
    for(const date of sortedDates.slice(0, 30)){
      const dayEntries = await buildDateEntriesFor(date, byDate[date]);
      html += buildDateCardHtml(date, dayEntries);
    }
    panel.innerHTML = html || '<div class="history-empty">아직 저장된 기록이 없어요.</div>';
    wireDeleteButtons(panel, loadHistory);
  }catch(e){
    panel.innerHTML = '<div class="history-empty">기록을 불러오지 못했어요.</div>';
  }
}

async function deleteHistoryEntry(date, day){
  try{
    await storage.delete(`workout:${date}:${day}`);
  }catch(e){ console.error('기록 삭제 실패', e); }
  try{
    const idxRes = await storage.get('workout:dates');
    let dates = [];
    if(idxRes && idxRes.value) dates = JSON.parse(idxRes.value);
    dates = dates.filter(entry => entry !== `${date}|${day}`);
    await storage.set('workout:dates', JSON.stringify(dates));
  }catch(e){ console.error('인덱스 업데이트 실패', e); }

  if(date === todayKey() && day === currentDay){
    currentData = initEmptyData(currentRoutine);
  }
}

async function renderCalendar(){
  const box = document.getElementById('calendarBox');

  dates.forEach(entry => {
    const [date, day] = entry.split('|');
    if(!dateSet[date]) dateSet[date] = [];
    dateSet[date].push(day);
  });

  const year = calMonth.getFullYear();
  const month = calMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = todayKey();

  let cells = '';
  ['일','월','화','수','목','금','토'].forEach(w => { cells += `<div class="cal-weekday">${w}</div>`; });
  for(let i = 0; i < startOffset; i++){ cells += `<div class="cal-day"></div>`; }
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasRecord = !!dateSet[dateStr];
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === calSelectedDate;
    cells += `<div class="cal-day ${hasRecord ? 'has-record' : ''} ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" data-date="${dateStr}">${d}</div>`;

      <div class="cal-nav-btn" id="calNext">›</div>
    </div>
    <div class="cal-grid">${cells}</div>
  `;

  document.getElementById('calPrev').addEventListener('click', () => {
    calMonth.setMonth(calMonth.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', () => {
    calMonth.setMonth(calMonth.getMonth() + 1);
    renderCalendar();
  });

  box.querySelectorAll('.cal-day.has-record').forEach(cell => {
    cell.addEventListener('click', async () => {
      calSelectedDate = cell.dataset.date;
      renderCalendar();
      await showCalDetail(calSelectedDate, dateSet[calSelectedDate]);

  });
}

const DAY_ORDER = ['chest','back','shoulder','arm','leg','abs','cardio'];

async function loadRecommendation(){
  const box = document.getElementById('recoCard');
  try{
    const dates = (await getAllDateEntries()).slice().sort().reverse();
    if(dates.length === 0){
      suggestedDay = null;
      box.innerHTML = `
        <div class="reco-eyebrow">오늘의 추천 루틴</div>
        <div class="reco-empty">아직 기록이 없어요. 오늘 첫 운동을 시작해보세요!</div>
      `;
      return;

    const recentEntries = dates.slice(0, 2).map(e => {
      const [date, day] = e.split('|');
      return { date, day };
    });

    const recentHtml = recentEntries.map(r => {

// ===== 홈 대시보드 확장 섹션 =====
const WEEK_GOALS = { strength: 5, cardio: 5 }; // 주간 목표 횟수 (기본값)

function getWeekStart(d = new Date()){
  const day = d.getDay(); // 0=일 ... 6=토
  const diff = (day === 0 ? -6 : 1) - day; // 월요일까지 거리
  const monday = new Date(d);
  monday.setDate(d.getDate() + diff);
  monday.setHours(0,0,0,0);
  return monday;
}

function renderBar(count, goal){
  const filled = Math.min(count, goal);
  let bar = '';
  for(let i = 0; i < goal; i++) bar += i < filled ? '■' : '□';
  return bar;
}

function volumeOfSets(sets){
  return (sets || []).reduce((sum, s) => {
    if(s && 'weight' in s){
      const w = parseFloat(s.weight) || 0;
      const r = parseFloat(s.reps) || 0;
      return sum + w * r;
    }
    return sum;
  }, 0);
}

function volumeOfDayData(data){
  return Object.values(data || {}).reduce((sum, sets) => sum + volumeOfSets(sets), 0);
}

  const box = document.getElementById('weeklyProgressBox');
  const weekStart = getWeekStart();
  const strengthDates = new Set();

  entries.forEach(entry => {
    const [date, day] = entry.split('|');
    const d = new Date(date + 'T00:00:00');
    if(d >= weekStart){
      if(day === 'cardio') cardioDates.add(date);
      else strengthDates.add(date);
    }
  });
  box.innerHTML = `
    <div class="week-progress-row">
      <span class="week-progress-label">운동</span>
      <span class="week-progress-bar">${renderBar(strengthDates.size, WEEK_GOALS.strength)}</span>
      <span class="week-progress-count">${strengthDates.size} / ${WEEK_GOALS.strength}회</span>
    </div>
    <div class="week-progress-row">
      <span class="week-progress-label">유산소</span>
      <span class="week-progress-bar">${renderBar(cardioDates.size, WEEK_GOALS.cardio)}</span>
      <span class="week-progress-count">${cardioDates.size} / ${WEEK_GOALS.cardio}회</span>
    </div>
  `;
}

async function renderBodyMini(){
  const box = document.getElementById('bodyMiniBox');
  const records = await loadBodyRecords();
  if(records.length === 0){
    box.innerHTML = `<div class="dash-empty">변화 탭에서 첫 기록을 남겨보세요.</div>`;
    return;
  }
  const latest = records[records.length - 1];
  const prev = records.length > 1 ? records[records.length - 2] : null;

  function cell(field, label, unit, showValue){
    const cur = parseFloat(latest[field]);
    const hasCur = latest[field] !== '' && latest[field] !== undefined && !isNaN(cur);
    let deltaHtml = '<div class="body-mini-delta">-</div>';
    if(hasCur && prev){
      const pv = parseFloat(prev[field]);
      if(!isNaN(pv)){
        const d = Math.round((cur - pv) * 10) / 10;
        if(d > 0) deltaHtml = `<div class="body-mini-delta up">+${d}${unit}</div>`;
        else if(d < 0) deltaHtml = `<div class="body-mini-delta down">${d}${unit}</div>`;
        else deltaHtml = `<div class="body-mini-delta">변화없음</div>`;
      }
    }
    const valueHtml = showValue
      ? `<div class="body-mini-value">${hasCur ? cur + unit : '-'}</div>`
      : '';
    return `<div class="body-mini-box"><div class="body-mini-label">${label}</div>${valueHtml}${deltaHtml}</div>`;
  }

  box.innerHTML = `<div class="body-mini-row">
    ${cell('weight', '몸무게', 'kg', true)}
    ${cell('muscle', '골격근량', 'kg', false)}
    ${cell('fat', '체지방률', '%', false)}
  </div>`;
}

async function renderRecentWorkout(entries){
  const box = document.getElementById('recentWorkoutBox');
  if(entries.length === 0){
    box.innerHTML = `<div class="dash-empty">아직 기록이 없어요.</div>`;
    return;
  }
  const byDate = {};
  entries.forEach(entry => {
    const [date, day] = entry.split('|');
    if(!byDate[date]) byDate[date] = [];
    byDate[date].push(day);
  });
  const latestDate = Object.keys(byDate).sort().reverse()[0];
  const dayEntries = await buildDateEntriesFor(latestDate, byDate[latestDate]);
  const label = dayEntries.map(d => ROUTINE[d.day] ? ROUTINE[d.day].label.split(' · ')[0] : d.day).join(' + ');
  const totalVolume = dayEntries.reduce((sum, d) => sum + volumeOfDayData(d.data), 0);
  const durationRaw = localStorage.getItem(`workout:duration:${latestDate}`);

  let metaHtml = `<span>${latestDate.slice(5).replace('-', '.')}</span>`;
  if(durationRaw) metaHtml += `<span><b>${durationRaw}분</b></span>`;
  if(totalVolume > 0) metaHtml += `<span>총 볼륨 <b>${Math.round(totalVolume).toLocaleString()}kg</b></span>`;

  box.innerHTML = `
    <div class="recent-workout-card">
      <div class="recent-workout-title">${label || '운동'}</div>
      <div class="recent-workout-meta">${metaHtml}</div>
    </div>
  `;
}

async function renderMonthlyGrowth(entries){
  const box = document.getElementById('monthlyGrowthBox');
  const now = new Date();
  const monthPrefix = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  const byDate = {};
  entries.forEach(entry => {
    const [date, day] = entry.split('|');
    if(!byDate[date]) byDate[date] = [];
    byDate[date].push(day);
  });
  const monthDates = Object.keys(byDate).filter(d => d.startsWith(monthPrefix));

  let totalVolume = 0;
  for(const date of monthDates){
    const dayEntries = await buildDateEntriesFor(date, byDate[date]);
    dayEntries.forEach(d => { totalVolume += volumeOfDayData(d.data); });
  }

  // 연속 기록 스트릭 계산 (오늘 또는 어제부터 거슬러 연속된 날짜 수)
  const allDates = new Set(Object.keys(byDate));
  let streak = 0;
  let cursor = new Date();
  cursor.setHours(0,0,0,0);
  const cursorKey = () => cursor.toISOString().slice(0,10);
  if(!allDates.has(cursorKey())){
    cursor.setDate(cursor.getDate() - 1); // 오늘 기록이 없으면 어제부터 확인
  }
  while(allDates.has(cursorKey())){
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }

  box.innerHTML = `
    <div class="growth-row">
      <div class="growth-box"><div class="growth-num">${monthDates.length}</div><div class="growth-label">운동 횟수</div></div>
      <div class="growth-box"><div class="growth-num">${Math.round(totalVolume).toLocaleString()}</div><div class="growth-label">총 볼륨(kg)</div></div>
      <div class="growth-box"><div class="growth-num">${streak}일</div><div class="growth-label">연속 기록</div></div>
    </div>
  `;
}

async function renderRecentPR(entries){
  const box = document.getElementById('recentPRBox');
  const sortedEntries = entries.slice().sort().reverse().slice(0, 60); // 최근 60개 기록까지 스캔
  const prMap = {}; // { 운동이름: {weight, reps, date} }

  for(const entry of sortedEntries){
    const [date, day] = entry.split('|');
    const res = await storage.get(`workout:${date}:${day}`);
    if(!res || !res.value) continue;
    const data = JSON.parse(res.value);
    Object.keys(data).forEach(exName => {
      (data[exName] || []).forEach(s => {
        if(!s || !('weight' in s)) return;
        const w = parseFloat(s.weight);
        if(!w || isNaN(w)) return;
        const existing = prMap[exName];
        if(!existing || w > existing.weight){
          prMap[exName] = { weight: w, reps: s.reps || '-', date };
        }
      });
    });
  }

  const prList = Object.keys(prMap)
    .map(name => ({ name, ...prMap[name] }))
    .sort((a,b) => b.date.localeCompare(a.date))
    .slice(0, 3);

  if(prList.length === 0){
    box.innerHTML = `<div class="dash-empty">무게 기록이 쌓이면 최고기록이 여기 나타나요.</div>`;
    return;
  }

  box.innerHTML = prList.map(pr => `
    <div class="pr-item">
      <span class="pr-name">${pr.name}</span>
      <span class="pr-value">${pr.weight}kg × ${pr.reps}</span>
    </div>
  `).join('');
}

async function loadHomeExtras(){
  try{
    const entries = await getAllDateEntries();
    renderWeeklyProgress(entries);
    renderBodyMini();
    renderRecentWorkout(entries);
    renderMonthlyGrowth(entries);
    renderRecentPR(entries);
  }catch(e){
    console.error('홈 대시보드 로딩 실패', e);
  }
}

// ===== 변화 탭 (몸무게 / 골격근량 / 체지방률) =====
let currentChartMetric = 'weight';
const METRIC_UNIT = { weight: 'kg', muscle: 'kg', fat: '%' };
const METRIC_LABEL = { weight: '몸무게', muscle: '골격근량', fat: '체지방률' };

async function loadBodyRecords(){
  try{
    const res = await storage.get('body:records');
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){}
  return [];
}

async function saveBodyRecords(records){
  await storage.set('body:records', JSON.stringify(records));
}

async function saveBodyEntry(){
  const date = document.getElementById('bodyDateInput').value || todayKey();
  const weight = document.getElementById('bodyWeightInput').value;
  const muscle = document.getElementById('bodyMuscleInput').value;
  const fat = document.getElementById('bodyFatInput').value;
  if(!weight && !muscle && !fat){
    showToast('값을 하나 이상 입력해주세요');
    return;
  }
  let records = await loadBodyRecords();
  const idx = records.findIndex(r => r.date === date);
  const prevEntry = idx >= 0 ? records[idx] : {};
  const entry = {
    date,
    weight: weight !== '' ? weight : (prevEntry.weight || ''),
    muscle: muscle !== '' ? muscle : (prevEntry.muscle || ''),
    fat: fat !== '' ? fat : (prevEntry.fat || '')
  };
  if(idx >= 0) records[idx] = entry; else records.push(entry);
  records.sort((a,b) => a.date.localeCompare(b.date));
  await saveBodyRecords(records);
  showToast('변화 기록 저장됐어요 📈');
  document.getElementById('bodyWeightInput').value = '';
  document.getElementById('bodyMuscleInput').value = '';
  document.getElementById('bodyFatInput').value = '';
  loadBodyPage();
  loadHomeExtras();
}

function renderBodyStats(records){
  const box = document.getElementById('bodyStats');
  if(records.length === 0){
    box.innerHTML = `<div class="reco-empty" style="padding:4px 2px;">아직 기록이 없어요. 첫 기록을 남겨보세요!</div>`;
    return;
  }
  const latest = records[records.length - 1];
  const prev = records.length > 1 ? records[records.length - 2] : null;

  function statHtml(field, unit){
    const curRaw = latest[field];
    const cur = parseFloat(curRaw);
    if(curRaw === '' || curRaw === undefined || isNaN(cur)){
      return `<div class="stat-num">-</div>`;
    }
    let deltaHtml = '';
    if(prev){
      const pv = parseFloat(prev[field]);
      if(!isNaN(pv)){
        const d = Math.round((cur - pv) * 10) / 10;
        if(d > 0) deltaHtml = `<div class="stat-delta up">▲ ${d}${unit}</div>`;
        else if(d < 0) deltaHtml = `<div class="stat-delta down">▼ ${Math.abs(d)}${unit}</div>`;
        else deltaHtml = `<div class="stat-delta">변화 없음</div>`;
      }
    }
    return `<div class="stat-num">${cur}${unit}</div>${deltaHtml}`;
  }

  box.innerHTML = `
    <div class="stat-box">${statHtml('weight', 'kg')}<div class="stat-label">몸무게</div></div>
    <div class="stat-box">${statHtml('muscle', 'kg')}<div class="stat-label">골격근량</div></div>
    <div class="stat-box">${statHtml('fat', '%')}<div class="stat-label">체지방률</div></div>
  `;
}

function monthlyAggregate(records, metric){
  const byMonth = {};
  records.forEach(r => {
    const v = parseFloat(r[metric]);
    if(isNaN(v)) return;
    const month = r.date.slice(0, 7);
    if(!byMonth[month]) byMonth[month] = [];
    byMonth[month].push(v);
  });
  const months = Object.keys(byMonth).sort();
  const recent = months.slice(-6);
  return recent.map(m => {
    const arr = byMonth[m];
    const avg = arr.reduce((a,b) => a+b, 0) / arr.length;
    return { label: m.slice(5) + '월', value: Math.round(avg * 10) / 10 };
  });
}

function buildLineChart(points, unit){
  if(points.length === 0){
    return `<div class="chart-empty">아직 데이터가 없어요.<br>기록을 저장하면 그래프가 나타나요.</div>`;
  }
  const w = 320, h = 170, padL = 34, padR = 14, padT = 18, padB = 26;
  const vals = points.map(p => p.value);
  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const range = (max - min) || 1;
  const stepX = points.length > 1 ? (w - padL - padR) / (points.length - 1) : 0;
  const x = i => padL + stepX * i;
  const y = v => (h - padB) - ((v - min) / range) * (h - padT - padB);

  let path = '', dots = '', labels = '';
  points.forEach((p, i) => {
    const px = points.length > 1 ? x(i) : (padL + (w - padL - padR) / 2);
    const py = y(p.value);
    path += (path ? 'L' : 'M') + px.toFixed(1) + ',' + py.toFixed(1) + ' ';
    dots += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3.6" fill="var(--plate)"/>`;
    labels += `<text x="${px.toFixed(1)}" y="${h-8}" font-size="9.5" fill="var(--chalk-dim)" text-anchor="middle">${p.label}</text>`;
    labels += `<text x="${px.toFixed(1)}" y="${(py-9).toFixed(1)}" font-size="9.5" fill="var(--chalk)" text-anchor="middle">${p.value}${unit}</text>`;
  });

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block;">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="var(--line)" stroke-width="1"/>
    <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="var(--line)" stroke-width="1"/>
    <path d="${path.trim()}" fill="none" stroke="var(--plate)" stroke-width="2"/>
    ${dots}
    ${labels}
  </svg>`;
}

function renderBodyChart(records){
  const points = monthlyAggregate(records, currentChartMetric);
  document.getElementById('bodyChart').innerHTML = buildLineChart(points, METRIC_UNIT[currentChartMetric]);
}

function renderBodyHistoryList(records){
  const box = document.getElementById('bodyHistoryList');
  if(records.length === 0){
    box.innerHTML = '<div class="history-empty">아직 저장된 변화 기록이 없어요.</div>';
    return;
  }
  const desc = records.slice().reverse();
  box.innerHTML = desc.map(r => `
    <div class="history-entry">
      <div class="history-entry-head">
        <span class="history-day">${r.date}</span>
        <span class="history-delete" data-date="${r.date}" title="이 기록 삭제">삭제</span>
      </div>
      <div class="history-ex">몸무게 <b>${r.weight || '-'}kg</b> · 골격근량 <b>${r.muscle || '-'}kg</b> · 체지방률 <b>${r.fat || '-'}%</b></div>
    </div>
  `).join('');
  box.querySelectorAll('.history-delete').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const date = btn.dataset.date;
      if(btn.dataset.confirming !== '1'){
        btn.dataset.confirming = '1';
        btn.textContent = '한번 더 탭하면 삭제';
        btn.classList.add('confirming');
        clearTimeout(btn._confirmTimer);
        btn._confirmTimer = setTimeout(() => {
          btn.dataset.confirming = '0';
          btn.textContent = '삭제';
          btn.classList.remove('confirming');
        }, 2500);
        return;
      }
      clearTimeout(btn._confirmTimer);
      let recs = await loadBodyRecords();
      recs = recs.filter(r => r.date !== date);
      await saveBodyRecords(recs);
      loadBodyPage();
    });
  });
}

async function loadBodyPage(){
  const records = await loadBodyRecords();
  renderBodyStats(records);
  renderBodyChart(records);
  renderBodyHistoryList(records);
}

document.getElementById('bodySaveBtn').addEventListener('click', saveBodyEntry);
document.getElementById('bodyDateInput').value = todayKey();
